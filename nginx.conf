server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Der Doku-Container ist ausschließlich intern erreichbar (Docker-Netz
    # "backend"). Erreichbarkeit von außen regelt das AdminPanel-Gateway,
    # das Requests nach Session-Prüfung hierher durchreicht.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # MkDocs nutzt Directory-URLs (…/reporting/ -> …/reporting/index.html).
    location / {
        try_files $uri $uri/ =404;
    }

    # Statische Assets aggressiv cachen; das Image ist pro Release unveränderlich.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Interner Health-Endpoint für Container-Orchestrierung.
    location = /_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
